<div>
    <div class="well well-sm">
        <div class="legend-information">
            <span class="information-button" data-toggle="modal" data-target="#legend-information-modal">
            </span>
            <div class="modal fade" id="legend-information-modal" tabindex="-1" role="dialog">
                <div class="modal-dialog legend-information-dialog" role="document">
                    <div class="modal-content">
                        <div class="modal-header">
                            <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                            <div class="modal-title">House Win Loss Legend</div>
                        </div>
                        <div class="modal-body">
                            <div data-nap-legend data-menu-id="487"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <form class="form-inline">
            <div class="form-group" data-ng-show="vm.normalMode">
                <label>Date</label>
                <nap-date-picker data-ng-model="vm.date"></nap-date-picker>
                <button type="button" class="btn btn-sm btn-filter" data-ng-click="vm.generate()">Generate</button>
                <button type="button" class="btn btn-sm btn-filter" data-ng-click="vm.todayClicked()">{{vm.today | amDateFormat:'MMM DD, YYYY'}}</button>
                <button type="button" class="btn btn-sm btn-filter" data-ng-click="vm.yesterdayClicked()">{{vm.yesterday | amDateFormat:'MMM DD, YYYY'}}</button>
                <button type="button" class="btn btn-sm btn-filter" data-ng-click="vm.viewHistoryMode()">History Report</button>
            </div>
            <div class="form-group"  data-ng-hide="vm.normalMode">
                <nap-month-picker data-start-date="vm.startDate" data-end-date="vm.endDate" data-max-date="vm.yesterday"></nap-month-picker>
                <button type="button" class="btn btn-sm btn-filter" data-ng-click="vm.generate()">Generate</button>
                <button type="button" class="btn btn-sm btn-filter" data-ng-click="vm.viewNormalMode()">Back</button>
            </div>
        </form>
    </div>   
</div>
