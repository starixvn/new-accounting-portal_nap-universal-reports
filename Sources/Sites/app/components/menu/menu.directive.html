<nav>
    <ul class="menu" ng-repeat="item in vm.menus">
        <li ng-class="{first: $first, last: $last && !$first}" ng-if="item.Children.length == 0 ">
            <a href="{{item.Url}}">{{item.Name}}</a>
        </li>
        <li ng-class="{first: $first, last: $last && !$first}" ng-if="item.Children.length != 0 " class="has-child">
            <a href="javascript:;">{{item.Name}}</a>
            <ul ng-repeat="childItem in item.Children">
                <li><a href="{{childItem.Url}}">{{childItem.Name}}</a></li>
            </ul>
        </li>
    </ul>
</nav>
