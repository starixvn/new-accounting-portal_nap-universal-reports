<nav>
    <ul class="menu">
        <li data-ng-repeat="item in vm.menus" data-ng-class="{first: $first, last: $last && !$first, 'has-child': item.Children}">
            <a href="javascript:;" data-ng-if="item.Children">{{item.Name}}</a>
            <a data-ng-href="{{item.Url}}" data-ng-if="!item.Children">{{item.Name}}</a>
            <ul class="sub-menu" data-ng-if="item.Children">
                <li data-ng-repeat="childItem in item.Children">
                    <a data-ng-href="{{childItem.Url}}">{{childItem.Name}}</a>
                </li>
            </ul>
        </li>
    </ul>
</nav>
