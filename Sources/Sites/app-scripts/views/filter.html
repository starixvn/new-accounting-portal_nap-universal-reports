<div data-ng-controller="FilterCtrl as vm">
    <div data-ng-bind="vm.date"></div>
    <div class="well well-sm">
        <div class="legend-information">
            <span class="information-button">
            </span>
        </div>
        <form class="form-inline">
            <div class="form-group">
                <label>Date</label>
                <nap-date-picker data-ng-model="vm.date"></nap-date-picker>
                <button type="button" class="btn btn-sm btn-filter" ng-click="vm.generate()">Generate</button>
                <button type="button" class="btn btn-sm btn-filter" ng-click="vm.todayClicked()">{{vm.today | date : 'MMM dd, yyyy'}}</button>
                <button type="button" class="btn btn-sm btn-filter" ng-click="vm.yesterdayClicked()">{{vm.yesterday | date : 'MMM dd, yyyy'}}</button>
                <button type="button" class="btn btn-sm btn-filter" ng-disabled="vm.disableExport">Export</button>
                <button type="button" class="btn btn-sm btn-filter" ng-disabled="vm.disableExpand">Expand</button>
            </div>
        </form>
    </div>
    <div class="filter-note">
        <span class="note-button" data-toggle="collapse" data-target="#note">
            Note
        </span>
        <ul id="note" class="note-body collapse in">
            <li>For more historical data, please click to HISTORY REPORT.</li>
            <li>The Virtual Rate is applied for Sportsbook. Other products are based on Actual Rate.</li>
        </ul>
    </div>
</div>
