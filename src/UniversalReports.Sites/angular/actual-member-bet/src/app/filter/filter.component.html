<div class="filter-container">
  <div class="row">
    <div class="col-nap">
      <div class="group-nap">
        <label>From Date</label>
        <div class="control-nap">
          <nap-date-picker [(date)]="startDate" [minDate]="minStartDate" [maxDate]="maxEndDate"></nap-date-picker>
        </div>
      </div>
    </div>
    <div class="col-nap">
      <div class="group-nap">
        <label>To Date</label>
        <div class="control-nap">
          <nap-date-picker [(date)]="endDate" [minDate]="startDate" [maxDate]="maxEndDate"></nap-date-picker>
        </div>
      </div>
    </div>
    <div class="col-nap">
      <div class="group-nap">
        <label class="col-form-label">Site</label>
        <div class="control-nap width-100">
          <select class="form-control" #siteSelect>
            <option *ngFor="let site of sites" value={{site.SiteType}}>
              {{site.SiteName}}
          </option>
          </select>
        </div>
      </div>
    </div>
    <div class="col-nap">
      <div class="group-nap">
        <label class="col-form-label">Currency</label>
        <div class="control-nap width-100">
          <select class="form-control" #currencySelect>
            <option *ngFor="let currency of currencies" value={{currency.CurrencyId}}>
              {{currency.CurrencyName}}
          </option>
          </select>
        </div>
      </div>
    </div>
    <div class="col-nap">
      <div class="group-nap">
        <label class="col-form-label">Odds Type</label>
        <div class="control-nap width-100">
          <select class="form-control" #oddsSelect>
            <option *ngFor="let odd of odds" value={{odd.OddsType}}>
              {{odd.OddsTypeName}}
          </option>
          </select>
        </div>
      </div>
    </div>
    <div class="col-nap col-buttons">
      <button class="btn btn-primary" (click)="onGenerate(siteSelect.value, currencySelect.value, oddsSelect.value)">GENERATE</button>
    </div>
  </div>
</div>
