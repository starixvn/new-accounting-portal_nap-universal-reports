<div class="col-label">
    <label class="col-form-label">Year</label>
</div>
<div class="col-value">
    <div class="d-inline-block">
        <select class="form-control" [(ngModel)]="year" (ngModelChange)="onYearChange()">
            <option *ngFor="let option of years" [ngValue]="option">{{option}}</option>
        </select>
    </div>
</div>
