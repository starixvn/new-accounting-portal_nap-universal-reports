<div class="input-group">
    <input class="form-control" readonly="readonly" ngbDatepicker #d="ngbDatepicker" [minDate]="minDate" [maxDate]="maxDate"
        [(ngModel)]="date" (ngModelChange)="onModelChange()">
    <div class="input-group-addon" (click)="d.toggle()">
        <i class="fa fa-calendar" aria-hidden="true"></i>
    </div>
</div>
