<div class="jumbotron filter-container">
    <div class="row">
        <div class="col-x1">
            <div class="col-label">
                <label class="col-form-label">Search by</label>
            </div>
            <div class="col-value">
                <div class="form-check form-check-inline" *ngFor="let option of searchByOptions">
                    <label class="form-check-label">
                        <input type="radio" class="form-check-input" name="searchBy" [(ngModel)]="searchBy" [value]="option.value" /> {{option.text}}
                    </label>
                </div>
            </div>
        </div>
        <div class="col-x2">
            <div class="col-label">
                <label class="col-form-label">Top rows</label>
            </div>
            <div class="col-value">
                <input style="width: 80px" class="form-control" type="number" [(ngModel)]="topRows" />
            </div>
        </div>
        <div class="col-x3">
            <div class="col-label">
                <label class="col-form-label">Order by</label>
            </div>
            <div class="col-value">
                <div class="d-inline-block">
                    <select class="form-control" [(ngModel)]="orderBy">
                        <option *ngFor="let option of orderByOptions" [value]="option.value">{{option.text}}</option>
                    </select>
                </div>
                <div class="float-right d-inline-block">
                    <select class="form-control" [(ngModel)]="order">
                        <option *ngFor="let option of orderOptions" [value]="option.value">{{option.text}}</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
    <nap-period-type [minDate]="minDate" [maxDate]="maxDate" (periodTypeChange)="onPeriodTypeChange($event)"></nap-period-type>
    <div class="row">
        <div class="col-x1">
            <div class="col-label">
                <label class="col-form-label">Depth</label>
            </div>
            <div class="col-value">
                <select class="form-control" [(ngModel)]="depth">
                    <option *ngFor="let option of depthOptions" [ngValue]="option.value">{{option.text}}</option>
                </select>
            </div>
        </div>
        <div class="col-x2">
            <div class="col-label">
                <label class="col-form-label">Account name<span class="text-danger">*</span></label>
            </div>
            <div class="col-value">
                <nap-dropdown-typeahead [(text)]="userName" [query]="userNameTypeaheadQuery" [placeholder]="depth === RoleId.Agent ? 'Agent name' : 'Member name'"></nap-dropdown-typeahead>
            </div>
        </div>
        <div class="col-x3">
            <div class="col-label">
                <label class="col-form-label">Product</label>
            </div>
            <div class="col-value"></div>
        </div>
    </div>
    <div class="row">
        <div class="col-x1">
            <div class="col-label">
            </div>
            <div class="col-value">
                <button type="submit" class="btn btn-primary" (click)="generate()">GENERATE</button>
            </div>
        </div>
    </div>
</div>
