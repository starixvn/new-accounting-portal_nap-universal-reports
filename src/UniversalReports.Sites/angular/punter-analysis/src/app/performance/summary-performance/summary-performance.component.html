<ng-template #table let-list="list" let-header="header" let-title="title" let-field="field">
  <table class="table table-striped">
    <colgroup>
      <col style="width: 28%">
      <col style="width: 28%">
      <col style="width: 28%">
      <col style="width: 16%">
    </colgroup>
    <thead>
      <tr>
        <th colspan="4">{{header}}</th>
      </tr>
      <tr>
        <td>{{title}}</td>
        <td class="text-right">Turnover</td>
        <td class="text-right">Win Loss</td>
        <td class="text-right">Margin %</td>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of list">
        <td>{{item[field]}}</td>
        <td class="text-right" [napDecimalFormat]="item.Turnover"></td>
        <td class="text-right" [napDecimalFormat]="item.WinLoss"></td>
        <td class="text-right" [napPercentFormat]="item.WinLoss/item.Turnover"></td>
      </tr>
    </tbody>
  </table>
</ng-template>
<div *ngIf="statistic" [ngSwitch]="hasData" class="performance-container">
  <div *ngSwitchCase="false" class="row">
    There is no data
  </div>
  <div *ngSwitchCase="true" class="row">
    <div class="col-8">
      <div class="row summary">
        <div class="col">
          <div class="box">
            <p>TURNOVER</p>
            <p [napDecimalFormat]="statistic.SummaryStatistic.Turnover"></p>
          </div>
        </div>
        <div class="col">
          <div class="box">
            <p>WIN LOSS</p>
            <p [napDecimalFormat]="statistic.SummaryStatistic.WinLoss"></p>
          </div>
        </div>
        <div class="col">
          <div class="box">
            <p>MARGIN %</p>
            <p [napPercentFormat]="statistic.SummaryStatistic.WinLoss/statistic.SummaryStatistic.Turnover"></p>
          </div>
        </div>
        <div class="col">
          <div class="box">
            <p>BET COUNT</p>
            <p [napIntegerFormat]="statistic.SummaryStatistic.BetCount"></p>
          </div>
        </div>
      </div>
      <div class="chart-container">
        <div class="row">
          <div class="col-6">
            <div class="box">
              <canvas baseChart [datasets]="marginData" [labels]="monthLabels" chartType="bar" [options]="marginOptions"></canvas>
            </div>
          </div>
          <div class="col-6">
            <div class="box">
              <canvas baseChart [data]="betCountData" [labels]="monthLabels" chartType="pie" [options]="betCountOptions"></canvas>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-6">
            <div class="box">
              <canvas baseChart [datasets]="winLossTurnoverData" [labels]="monthLabels" [options]="winLossTurnoverOptions" chartType="bar"></canvas>
            </div>
          </div>
          <div class="col-6">
            <div class="box">
              <canvas baseChart [data]="productData" [labels]="productLabels" chartType="pie" [options]="productOptions" (chartClick)="chartClicked($event)"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col table-container">
      <ng-template [ngTemplateOutlet]="table" [ngTemplateOutletContext]="{list: statistic.SportStatistics, header: 'Top 5 sports', title: 'Sports', field: 'SportName'}"></ng-template>
      <ng-template [ngTemplateOutlet]="table" [ngTemplateOutletContext]="{list: statistic.BetTypeStatistics, header: 'Top 10 bet types', title: 'Bet type', field: 'BetTypeName'}"></ng-template>
      <ng-template [ngTemplateOutlet]="table" [ngTemplateOutletContext]="{list: statistic.EventStatistics, header: 'Event choices', title: 'Event type', field: 'EventType'}"></ng-template>
    </div>
  </div>
</div>
