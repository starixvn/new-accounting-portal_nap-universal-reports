<div *ngIf="data" style="width: auto" class="grid">
    <div class="header" style="width: 1470px">
        <table style="width: 1470px">
            <colgroup>
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:90px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:90px" />
                <col style="width:120px" />

                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:90px" />
                <col style="width:120px" />
            </colgroup>
            <tr>
                <th rowspan="2">Bet Type</th>
                <th colspan="4">Non-Live</th>
                <th colspan="4">Live</th>
                <th colspan="4">Non-Live &amp; Live</th>
            </tr>
            <tr>
                <th>Win Loss</th>
                <th>Turnover</th>
                <th>Margin</th>
                <th>Bet Count</th>
                <th>Win Loss</th>
                <th>Turnover</th>
                <th>Margin</th>
                <th>Bet Count</th>
                <th>Win Loss</th>
                <th>Turnover</th>
                <th>Margin</th>
                <th>Bet Count</th>
            </tr>
            <tr *ngIf="data.Entities.length === 0">
                <th class="empty-data" colspan="13">There is no data</th>
            </tr>
        </table>
    </div>
    <div *ngIf="data.Entities.length > 0" class="body" style="width: 1490px">
        <table style="width: 1470px">
            <colgroup>
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:90px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:90px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:90px" />
                <col style="width:120px" />
            </colgroup>
            <tr *ngFor="let item of data.Entities">
                <td>{{ item.BetTypeName }}</td>
                <td>
                    <span *ngIf="!isLeagueAvailable()" [napDecimalFormat]="item.NonLiveWinLoss"></span>
                    <a *ngIf="isLeagueAvailable()" href="javascript:;" (click)="onShowLeagueNonLive(item.BetTypeId)" [napDecimalFormat]="item.NonLiveWinLoss"></a>
                </td>
                <td [napDecimalFormat]="item.NonLiveTurnover"></td>
                <td [napPercentFormat]="item.NonLiveWinLoss/item.NonLiveTurnover">
                </td>
                <td class="text-right">
                    <a href="javascript:;" (click)="onShowBetCountNonLive(item.BetTypeId)" [napIntegerFormat]="item.NonLiveBetCount"></a>
                </td>
                <td>
                    <span *ngIf="!isLeagueAvailable()" [napDecimalFormat]="item.LiveWinLoss"></span>
                    <a *ngIf="isLeagueAvailable()" href="javascript:;" (click)="onShowLeagueLive(item.BetTypeId)" [napDecimalFormat]="item.LiveWinLoss"></a>
                </td>
                <td [napDecimalFormat]="item.LiveTurnover"></td>
                <td [napPercentFormat]="item.LiveWinLoss/item.LiveTurnover">
                </td>
                <td class="text-right">
                    <a href="javascript:;" (click)="onShowBetCountLive(item.BetTypeId)" [napIntegerFormat]="item.LiveBetCount"></a>
                </td>
                <td class="text-right">
                    <span *ngIf="!isLeagueAvailable()" [napDecimalFormat]="item.WinLoss"></span>
                    <a *ngIf="isLeagueAvailable()" href="javascript:;" (click)="onShowLeague(item.BetTypeId)" [napDecimalFormat]="item.WinLoss"></a>
                </td>
                <td [napDecimalFormat]="item.Turnover"></td>
                <td [napPercentFormat]="item.WinLoss/item.Turnover">
                </td>
                <td>
                    <a href="javascript:;" (click)="onShowBetCount(betTypeItem.BetTypeId)" [napIntegerFormat]="betTypeItem.BetCount"></a>
                </td>
            </tr>
        </table>
    </div>
    <div class="footer" *ngIf="data.Entities.length > 0" style="width: 1470px">
        <table style="width: 1470px">
            <colgroup>
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:90px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:90px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:90px" />
                <col style="width:120px" />
            </colgroup>
            <tr>
                <td class="text-right">Total</td>
                <td [napDecimalFormat]="data.Total.NonLiveWinLoss"></td>
                <td [napDecimalFormat]="data.Total.NonLiveTurnover"></td>
                <td [napPercentFormat]="data.Total.NonLiveWinLoss/data.Total.NonLiveTurnover"></td>
                <td [napDecimalFormat]="data.Total.NonLiveBetCount"></td>
                <td [napDecimalFormat]="data.Total.LiveWinLoss"></td>
                <td [napDecimalFormat]="data.Total.LiveTurnover"></td>
                <td [napPercentFormat]="data.Total.LiveWinLoss/data.Total.LiveTurnover"></td>
                <td [napDecimalFormat]="data.Total.LiveBetCount"></td>
                <td [napDecimalFormat]="data.Total.WinLoss"></td>
                <td [napDecimalFormat]="data.Total.Turnover"></td>
                <td [napPercentFormat]="data.Total.WinLoss/data.Total.Turnover"></td>
                <td [napDecimalFormat]="data.Total.BetCount"></td>
            </tr>
        </table>
    </div>
</div>
