<div style="width: auto" class="grid">
    <div class="header" style="width: 1470px">
        <table style="width: 1470px">
            <colgroup>
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:90px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:90px" />
                <col style="width:120px" />

                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:90px" />
                <col style="width:120px" />
            </colgroup>
            <tr>
                <th rowspan="2">Bet Type</th>
                <th colspan="4">Non-Live</th>
                <th colspan="4">Live</th>
                <th colspan="4">Non-Live &amp; Live</th>
            </tr>
            <tr>
                <th>Win Loss</th>
                <th>Turnover</th>
                <th>Margin</th>
                <th>Bet Count</th>
                <th>Win Loss</th>
                <th>Turnover</th>
                <th>Margin</th>
                <th>Bet Count</th>
                <th>Win Loss</th>
                <th>Turnover</th>
                <th>Margin</th>
                <th>Bet Count</th>
            </tr>
            <tr *ngIf="viewModelItem.Entities.length === 0">
                <th class="empty-data" colspan="13">There is no data</th>
            </tr>
        </table>
    </div>
    <div *ngIf="viewModelItem.Entities.length > 0" class="body" style="width: 1490px">
        <table style="width: 1470px">
            <colgroup>
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:90px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:90px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:90px" />
                <col style="width:120px" />
            </colgroup>
            <tr *ngFor="let betTypeItem of viewModelItem.Entities">
                <td>{{ betTypeItem.BetTypeName }}</td>
                <td>
                    <span *ngIf="!isLeagueAvailable()" [napDecimalFormat]="betTypeItem.NonLiveWinLoss"></span>
                    <a *ngIf="isLeagueAvailable()" href="javascript:;" (click)="onShowLeagueNonLive(betTypeItem.BetTypeId)" [napDecimalFormat]="betTypeItem.NonLiveWinLoss"></a>
                </td>
                <td [napDecimalFormat]="betTypeItem.NonLiveTurnover"></td>
                <td [napPercentFormat]="betTypeItem.NonLiveWinLoss/betTypeItem.NonLiveTurnover">
                </td>
                <td>
                    <a href="javascript:;" (click)="onShowBetCountNonLive(betTypeItem.BetTypeId)" [napIntegerFormat]="betTypeItem.NonLiveBetCount"></a>
                </td>
                <td>
                    <span *ngIf="!isLeagueAvailable()" [napDecimalFormat]="betTypeItem.LiveWinLoss"></span>
                    <a *ngIf="isLeagueAvailable()" href="javascript:;" (click)="onShowLeagueLive(betTypeItem.BetTypeId)" [napDecimalFormat]="betTypeItem.LiveWinLoss"></a>
                </td>
                <td [napDecimalFormat]="betTypeItem.LiveTurnover"></td>
                <td [napPercentFormat]="betTypeItem.LiveWinLoss/betTypeItem.LiveTurnover">
                </td>
                <td>
                    <a href="javascript:;" (click)="onShowBetCountLive(betTypeItem.BetTypeId)" [napIntegerFormat]="betTypeItem.LiveBetCount"></a>
                </td>
                <td>
                    <span *ngIf="!isLeagueAvailable()" [napDecimalFormat]="betTypeItem.WinLoss"></span>
                    <a *ngIf="isLeagueAvailable()" href="javascript:;" (click)="onShowLeague(betTypeItem.BetTypeId)" [napDecimalFormat]="betTypeItem.WinLoss"></a>
                </td>
                <td [napDecimalFormat]="betTypeItem.Turnover"></td>
                <td [napPercentFormat]="betTypeItem.WinLoss/betTypeItem.Turnover">
                </td>
                <td>
                    <a href="javascript:;" (click)="onShowBetCount(betTypeItem.BetTypeId)" [napIntegerFormat]="betTypeItem.BetCount"></a>
                </td>
            </tr>
        </table>
    </div>
    <div class="footer" *ngIf="viewModelItem.Entities.length > 0" style="width: 1470px">
        <table style="width: 1470px">
            <colgroup>
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:90px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:90px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:120px" />
                <col style="width:90px" />
                <col style="width:120px" />
            </colgroup>
            <tr>
                <td class="text-right">Total</td>
                <td [napDecimalFormat]="viewModelItem.Total.NonLiveWinLoss"></td>
                <td [napDecimalFormat]="viewModelItem.Total.NonLiveTurnover"></td>
                <td [napPercentFormat]="viewModelItem.Total.NonLiveWinLoss/viewModelItem.Total.NonLiveTurnover"></td>
                <td [napDecimalFormat]="viewModelItem.Total.NonLiveBetCount"></td>
                <td [napDecimalFormat]="viewModelItem.Total.LiveWinLoss"></td>
                <td [napDecimalFormat]="viewModelItem.Total.LiveTurnover"></td>
                <td [napPercentFormat]="viewModelItem.Total.LiveWinLoss/viewModelItem.Total.LiveTurnover"></td>
                <td [napDecimalFormat]="viewModelItem.Total.LiveBetCount"></td>
                <td [napDecimalFormat]="viewModelItem.Total.WinLoss"></td>
                <td [napDecimalFormat]="viewModelItem.Total.Turnover"></td>
                <td [napPercentFormat]="viewModelItem.Total.WinLoss/viewModelItem.Total.Turnover"></td>
                <td [napDecimalFormat]="viewModelItem.Total.BetCount"></td>
            </tr>
        </table>
    </div>
</div>
