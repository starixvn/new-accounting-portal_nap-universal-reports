<div *ngIf="data" style="width: auto" class="grid">
    <div class="header" style="width: 1491px">
        <table>
            <colgroup>
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 90px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 90px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 90px" />
                <col style="width: 120px" />
                <col style="width: 20px" />
            </colgroup>
            <tr>
                <th rowspan="2">Bet Type</th>
                <th colspan="4">Non-Live</th>
                <th colspan="4">Live</th>
                <th colspan="4">Non-Live &amp; Live</th>
                <th rowspan="2"></th>
            </tr>
            <tr>
                <th>Win Loss</th>
                <th>Turnover</th>
                <th>Margin</th>
                <th>Bet Count</th>
                <th>Win Loss</th>
                <th>Turnover</th>
                <th>Margin</th>
                <th>Bet Count</th>
                <th>Win Loss</th>
                <th>Turnover</th>
                <th>Margin</th>
                <th>Bet Count</th>
            </tr>
            <tr *ngIf="!hasData">
                <th class="empty-data" colspan="14">There is no data</th>
            </tr>
        </table>
    </div>
    <div *ngIf="hasData" class="body" style="width: 1491px">
        <table>
            <colgroup>
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 90px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 90px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 90px" />
                <col style="width: 120px" />
            </colgroup>
            <tr *ngFor="let item of data.Entities">
                <td>{{ item.BetTypeName }}</td>
                <td class="number" [ngSwitch]="item.HasLeague">
                    <span *ngSwitchCase="false" [napDecimalFormat]="item.NonLiveWinLoss"></span>
                    <a *ngSwitchCase="true" href="javascript:;" (click)="showLeague(item.BetTypeId, item.BetTypeName, LiveStatus.NonLive)" [napDecimalFormat]="item.NonLiveWinLoss"></a>
                </td>
                <td class="text-right" [napDecimalFormat]="item.NonLiveTurnover"></td>
                <td class="number" [napPercentFormat]="item.NonLiveWinLoss/item.NonLiveTurnover"></td>
                <td class="text-right" [ngSwitch]="item.HasLeague">
                    <span *ngSwitchCase="false" [napIntegerFormat]="item.NonLiveBetCount"></span>
                    <a *ngSwitchCase="true" href="javascript:;" (click)="showBetCount(item.BetTypeId, LiveStatus.NonLive)" [napIntegerFormat]="item.NonLiveBetCount"></a>
                </td>
                <td class="number" [ngSwitch]="item.HasLeague">
                    <span *ngSwitchCase="false" [napDecimalFormat]="item.LiveWinLoss"></span>
                    <a *ngSwitchCase="true" href="javascript:;" (click)="showLeague(item.BetTypeId, item.BetTypeName, LiveStatus.Live)" [napDecimalFormat]="item.LiveWinLoss"></a>
                </td>
                <td class="text-right" [napDecimalFormat]="item.LiveTurnover"></td>
                <td class="number" [napPercentFormat]="item.LiveWinLoss/item.LiveTurnover"></td>
                <td class="text-right" [ngSwitch]="item.HasLeague">
                    <span *ngSwitchCase="false" [napIntegerFormat]="item.LiveBetCount"></span>
                    <a *ngSwitchCase="true" href="javascript:;" (click)="showBetCount(item.BetTypeId, LiveStatus.Live)" [napIntegerFormat]="item.LiveBetCount"></a>
                </td>
                <td class="number" [ngSwitch]="item.HasLeague">
                    <span *ngSwitchCase="false" [napDecimalFormat]="item.WinLoss"></span>
                    <a *ngSwitchCase="true" href="javascript:;" (click)="showLeague(item.BetTypeId, item.BetTypeName)" [napDecimalFormat]="item.WinLoss"></a>
                </td>
                <td class="text-right" [napDecimalFormat]="item.Turnover"></td>
                <td class="number" [napPercentFormat]="item.WinLoss/item.Turnover">
                </td>
                <td class="text-right" [ngSwitch]="item.HasLeague">
                    <span *ngSwitchCase="false" [napIntegerFormat]="item.BetCount"></span>
                    <a *ngSwitchCase="true" href="javascript:;" (click)="showBetCount(item.BetTypeId)" [napIntegerFormat]="item.BetCount"></a>
                </td>
            </tr>
        </table>
    </div>
    <div class="footer" *ngIf="hasData" style="width: 1491px">
        <table>
            <colgroup>
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 90px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 90px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 90px" />
                <col style="width: 120px" />
                <col style="width: 20px" />
            </colgroup>
            <tr>
                <td class="text-right">Total</td>
                <td class="number" [napDecimalFormat]="data.Total.NonLiveWinLoss"></td>
                <td class="text-right" [napDecimalFormat]="data.Total.NonLiveTurnover"></td>
                <td class="number" [napPercentFormat]="data.Total.NonLiveWinLoss/data.Total.NonLiveTurnover"></td>
                <td class="text-right" [napIntegerFormat]="data.Total.NonLiveBetCount"></td>
                <td class="number" [napDecimalFormat]="data.Total.LiveWinLoss"></td>
                <td class="text-right" [napDecimalFormat]="data.Total.LiveTurnover"></td>
                <td class="number" [napPercentFormat]="data.Total.LiveWinLoss/data.Total.LiveTurnover"></td>
                <td class="text-right" [napIntegerFormat]="data.Total.LiveBetCount"></td>
                <td class="number" [napDecimalFormat]="data.Total.WinLoss"></td>
                <td class="text-right" [napDecimalFormat]="data.Total.Turnover"></td>
                <td class="number" [napPercentFormat]="data.Total.WinLoss/data.Total.Turnover"></td>
                <td class="text-right" [napIntegerFormat]="data.Total.BetCount"></td>
                <td></td>
            </tr>
        </table>
    </div>
</div>
