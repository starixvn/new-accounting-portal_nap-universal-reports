<ng-template #colgroup>
    <colgroup>
        <col style="width: 170px" />
        <col style="width: 120px" />
        <col style="width: 120px" />
        <col style="width: 90px" />
        <col style="width: 90px" />
        <col style="width: 100px" />
    </colgroup>
</ng-template>
<div *ngIf="data" class="grid">
    <div style="width: 708px">
        <div class="header">
            <table [class.w-100]="!hasData">
                <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Win Loss</th>
                        <th>Turnover</th>
                        <th>Margin</th>
                        <th>Bet Count</th>
                        <th>Associated Accounts</th>
                    </tr>
                </thead>
                <tbody *ngIf="!hasData">
                    <tr>
                        <th class="empty-data" colspan="6">There is no data</th>
                    </tr>
                </tbody>
            </table>
        </div>
        <div *ngIf="hasData" class="body">
            <table>
                <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                <tbody>
                    <tr *ngFor="let item of data.Entities | paginate: config">
                        <td class="word-break-all"><a href="javascript:;" (click)="showSportType(item.CustId, item.Username)">{{ item.Username }}</a></td>
                        <td class="number" [napDecimalFormat]="item.WinLoss"></td>
                        <td class="text-right" [napDecimalFormat]="item.Turnover"></td>
                        <td class="number" [napPercentFormat]="item.WinLoss/item.Turnover"></td>
                        <td class="text-right">
                            <a href="javascript:;" (click)="showBetCount(item.CustId, item.Username)" [napIntegerFormat]="item.BetCount"></a>
                        </td>
                        <td class="text-center"><a href="javascript:;" (click)="showAssociatedAccount(item.CustId, item.Username)">view</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="footer" *ngIf="hasData">
            <table>
                <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                <tfoot>
                    <tr>
                        <td class="text-right">Total</td>
                        <td class="number" [napDecimalFormat]="data.Total.WinLoss"></td>
                        <td class="text-right" [napDecimalFormat]="data.Total.Turnover"></td>
                        <td class="number" [napPercentFormat]="data.Total.WinLoss/data.Total.Turnover"></td>
                        <td class="text-right" [napIntegerFormat]="data.Total.BetCount"></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td colspan="6">
                            <nap-pagination [config]="config"></nap-pagination>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>
