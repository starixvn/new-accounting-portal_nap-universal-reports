<div *ngIf="data" style="width: auto" class="grid">
    <div class="header" style="width: 690px">
        <table style="width: 690px">
            <colgroup>
                <col style="width: 170px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 90px" />
                <col style="width: 90px" />
                <col style="width: 100px" />
            </colgroup>
            <tr>
                <th>Username</th>
                <th>Win Loss</th>
                <th>Turnover</th>
                <th>Margin</th>
                <th>Bet Count</th>
                <th>Associated Accounts</th>
            </tr>
            <tr *ngIf="data.Entities.length === 0">
                <th class="empty-data" colspan="6">There is no data</th>
            </tr>
        </table>
    </div>
    <div *ngIf="data.Entities.length > 0" class="body" style="width: 710px">
        <table style="width: 690px">
            <colgroup>
                <col style="width: 170px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 90px" />
                <col style="width: 90px" />
                <col style="width: 100px" />
            </colgroup>
            <tr *ngFor="let item of data.Entities | paginate: config">
                <td class="word-break-all"><a href="javascript:;" (click)="showSportType(item.CustId, item.Username)">{{ item.Username }}</a></td>
                <td [napDecimalFormat]="item.WinLoss"></td>
                <td [napDecimalFormat]="item.Turnover"></td>
                <td [napPercentFormat]="item.WinLoss/item.Turnover"></td>
                <td class="text-right">
                    <a href="javascript:;" (click)="showBetCount(item.CustId, item.Username)" [napIntegerFormat]="item.BetCount"></a>
                </td>
                <td class="text-center"><a href="javascript:;" (click)="showAssociatedAccount(item.CustId, item.Username)">view</a></td>
            </tr>
        </table>
    </div>
    <div class="footer" *ngIf="data.Entities.length > 0" style="width: 690px">
        <table style="width: 69px">
            <colgroup>
                <col style="width: 170px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 90px" />
                <col style="width: 90px" />
                <col style="width: 100px" />
            </colgroup>
            <tr>
                <td class="text-right">Total</td>
                <td [napDecimalFormat]="data.Total.WinLoss"></td>
                <td [napDecimalFormat]="data.Total.Turnover"></td>
                <td [napPercentFormat]="data.Total.WinLoss/data.Total.Turnover"></td>
                <td [napIntegerFormat]="data.Total.BetCount"></td>
                <td></td>
            </tr>
            <tr>
                <td colspan="6">
                    <nap-pagination [config]="config"></nap-pagination>
                </td>
            </tr>
        </table>
    </div>
</div>
