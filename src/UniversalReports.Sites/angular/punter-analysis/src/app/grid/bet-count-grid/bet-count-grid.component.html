<div *ngIf="data" style="width: auto" class="grid">
    <div class="header" style="width: 620px">
        <table style="width: 620px">
            <colgroup>
                <col style="width: 140px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
            </colgroup>
            <tr>
                <th>Date</th>
                <th>Bet Count</th>
                <th>Win Count</th>
                <th>Draw Count</th>
                <th>Win Loss</th>
            </tr>
            <tr *ngIf="data.Entities.length === 0">
                <th class="empty-data" colspan="5">There is no data</th>
            </tr>
        </table>
    </div>
    <div *ngIf="data.Entities.length > 0" class="body" style="width: 640px">
        <table style="width: 620px">
            <colgroup>
                <col style="width: 140px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
            </colgroup>
            <tr *ngFor="let item of data.Entities">
                <td>{{ item.Date | napPeriodDate: this.periodType}}</td>
                <td [napIntegerFormat]="item.BetCount"></td>
                <td [napIntegerFormat]="item.WinCount"></td>
                <td [napIntegerFormat]="item.DrawCount"></td>
                <td [napDecimalFormat]="item.WinLoss"></td>
            </tr>
        </table>
    </div>
    <div class="footer" *ngIf="data.Entities.length > 0" style="width: 620px">
        <table style="width: 620px">
            <colgroup>
                <col style="width: 140px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
            </colgroup>
            <tr>
                <td style="text-align: right" class="string">Total</td>
                <td [napIntegerFormat]="data.Total.BetCount"></td>
                <td [napIntegerFormat]="data.Total.WinCount"></td>
                <td [napIntegerFormat]="data.Total.DrawCount"></td>
                <td [napDecimalFormat]="data.Total.WinLoss"></td>
            </tr>
        </table>
    </div>
</div>
