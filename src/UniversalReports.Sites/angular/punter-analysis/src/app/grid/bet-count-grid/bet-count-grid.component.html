<div style="width: auto" class="grid">
    <div class="header" style="width: 620px">
        <table style="width: 620px">
            <colgroup>
                <col style="width: 140px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
            </colgroup>
            <tr>
                <th>Date</th>
                <th>Bet Count</th>
                <th>Win Count</th>
                <th>Draw Count</th>
                <th>Win Loss</th>
            </tr>
            <tr *ngIf="viewModelItem.Entities.length === 0">
                <th class="empty-data" colspan="5">There is no data</th>
            </tr>
        </table>
    </div>
    <div *ngIf="viewModelItem.Entities.length > 0" class="body" style="width: 640px">
        <table style="width: 620px">
            <colgroup>
                <col style="width: 140px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
            </colgroup>
            <tr *ngFor="let betCountItem of viewModelItem.Entities">
                <td date-by-period-text [period-type]="periodType" [date]="betCountItem.Date"></td>
                <td [napIntegerFormat]="betCountItem.BetCount"></td>
                <td [napIntegerFormat]="betCountItem.WinCount"></td>
                <td [napIntegerFormat]="betCountItem.DrawCount"></td>
                <td [napDecimalFormat]="betCountItem.WinLoss"></td>
            </tr>
        </table>
    </div>
    <div class="footer" *ngIf="viewModelItem.Entities.length > 0" style="width: 620px">
        <table style="width: 620px">
            <colgroup>
                <col style="width: 140px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
            </colgroup>
            <tr>
                <td style="text-align: right" class="string">Total</td>
                <td [napIntegerFormat]="viewModelItem.Total.BetCount"></td>
                <td [napIntegerFormat]="viewModelItem.Total.WinCount"></td>
                <td [napIntegerFormat]="viewModelItem.Total.DrawCount"></td>
                <td [napDecimalFormat]="viewModelItem.Total.WinLoss"></td>
            </tr>
        </table>
    </div>
</div>
