<div class="header">
    <ol class="breadcrumb">
        <li *ngFor="let item of items; let index = index; let isLast = last" class="breadcrumb-item" [class.active]="isLast" [ngSwitch]="isLast">
            <a *ngSwitchCase="false" href="javascript:;" click="onClick(index)">{{item}}</a>
            <span *ngSwitchCase="true">{{item}}</span>
        </li>
    </ol>
    <div class="toolbox">
        <i class="icon-excel" title="Export excel" (click)="onExportExcel()"></i>
    </div>
</div>
