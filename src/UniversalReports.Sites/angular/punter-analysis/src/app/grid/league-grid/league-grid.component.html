<div style="width: 100%;" class="grid">
    <div class="header" [ngStyle]="{'width.px': 120 + viewModelItem.GroupNames.length * 450 }">
        <table [ngStyle]="{'width.px': 120 + viewModelItem.GroupNames.length * 450 }">
            <colgroup>
                <col style="width:120px" />
                <template ngFor let-groupName [ngForOf]="viewModelItem.GroupNames">
                    <col style="width:120px" />
                    <col style="width:120px" />
                    <col style="width:90px" />
                     <col style="width:120px" />
                </template>

            </colgroup>
            <tr>
                <th rowspan="2">League</th>
                <th *ngFor="let groupName of viewModelItem.GroupNames" colspan="4">{{groupName}}</th>
            </tr>
            <tr>
                <template ngFor let-groupName [ngForOf]="viewModelItem.GroupNames">
                    <th>Win Loss</th>
                    <th>Turnover</th>
                    <th>Margin</th>
                    <th>Bet Count</th>
                </template>
            </tr>
            <tr *ngIf="viewModelItem.Entities.length == 0">
                <th class="empty-data" [colSpan]="1 + viewModelItem.GroupNames.length * 4">There is no data</th>
            </tr>
        </table>
    </div>
    <div *ngIf="viewModelItem.Entities.length > 0" class="body" [ngStyle]="{'width.px': 140 + viewModelItem.GroupNames.length * 450 }">
        <table [ngStyle]="{'width.px': 120 + viewModelItem.GroupNames.length * 450 }">
            <colgroup>
                <col style="width:120px" />
                <template ngFor let-groupName [ngForOf]="viewModelItem.GroupNames">
                    <col style="width:120px" />
                    <col style="width:120px" />
                    <col style="width:90px" />
                    <col style="width:120px" />
                </template>
            </colgroup>
            <tr *ngFor="let leagueItem of viewModelItem.Entities">
                <td class="string">{{ leagueItem.LeagueName }}</td>
                <template ngFor let-i="index" let-groupName [ngForOf]="viewModelItem.GroupNames">
                    <td class="number" decimal-text [decimal]="leagueItem.PeriodGroups[i].WinLoss"> </td>
                    <td class="number" decimal-text [decimal]="leagueItem.PeriodGroups[i].Turnover"> </td>
                    <td class="number" margin-text [turnover]="leagueItem.PeriodGroups[i].Turnover" [win-loss]="leagueItem.PeriodGroups[i].WinLoss">
                    </td>
                    <td class="number" integer-text [integer]="leagueItem.PeriodGroups[i].BetCount"> </td>
                </template>
            </tr>
        </table>
    </div>
    <div class="footer" *ngIf="viewModelItem.Entities.length > 0" [ngStyle]="{'width.px': 120 + viewModelItem.GroupNames.length * 450 }">
        <table [ngStyle]="{'width.px': 120 + viewModelItem.GroupNames.length * 450 }">
            <colgroup>
                <col style="width:120px" />
                <template ngFor let-groupName [ngForOf]="viewModelItem.GroupNames">
                    <col style="width:120px" />
                    <col style="width:120px" />
                    <col style="width:90px" />
                    <col style="width:120px" />
                </template>

            </colgroup>

            <tr>
                <td style="text-align: right" class="string">Total</td>
                <template ngFor let-i="index" let-groupName [ngForOf]="viewModelItem.GroupNames">
                    <td class="number" decimal-text [decimal]="viewModelItem.Total.PeriodGroups[i].WinLoss"> </td>
                    <td class="number" decimal-text [decimal]="viewModelItem.Total.PeriodGroups[i].Turnover"> </td>
                    <td class="number" margin-text [turnover]="viewModelItem.Total.PeriodGroups[i].Turnover" [win-loss]="viewModelItem.Total.PeriodGroups[i].Turnover">
                    </td>
                    <td class="number" integer-text [integer]="viewModelItem.Total.PeriodGroups[i].BetCount"> </td>
                </template>
            </tr>
        </table>
    </div>
</div>
