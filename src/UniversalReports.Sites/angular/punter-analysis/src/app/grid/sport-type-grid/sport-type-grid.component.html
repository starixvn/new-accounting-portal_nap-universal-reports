<div *ngIf="data" style="width: auto" class="grid">
    <div class="header" style="width: 591px">
        <table>
            <colgroup>
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 90px" />
                <col style="width: 120px" />
                <col style="width: 20px" />
            </colgroup>
            <tr>
                <th>Sport Type</th>
                <th>Win Loss</th>
                <th>Turnover</th>
                <th>Margin</th>
                <th>Bet Count</th>
                <th></th>
            </tr>
            <tr *ngIf="!hasData">
                <th class="empty-data" colspan="6">There is no data</th>
            </tr>
        </table>
    </div>
    <div *ngIf="hasData" class="body" style="width: 591px">
        <table>
            <colgroup>
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 90px" />
                <col style="width: 120px" />
            </colgroup>
            <tr *ngFor="let item of data.Entities">
                <td><a href="javascript:;" (click)="showBetType(item.SportId, item.SportName)">{{ item.SportName }}</a></td>
                <td class="number" [napDecimalFormat]="item.WinLoss"></td>
                <td class="text-right" [napDecimalFormat]="item.Turnover"></td>
                <td class="number" [napPercentFormat]="item.WinLoss/item.Turnover"></td>
                <td class="text-right">
                    <a href="javascript:;" (click)="showBetCount(item.SportId)" [napIntegerFormat]="item.BetCount"></a>
                </td>
            </tr>
        </table>
    </div>
    <div class="footer" *ngIf="hasData" style="width: 591px">
        <table>
            <colgroup>
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 90px" />
                <col style="width: 120px" />
                <col style="width: 20px" />
            </colgroup>
            <tr>
                <td style="width:120px" class="text-right">Total</td>
                <td class="number" [napDecimalFormat]="data.Total.WinLoss"></td>
                <td class="text-right" [napDecimalFormat]="data.Total.Turnover"></td>
                <td class="number" [napPercentFormat]="data.Total.WinLoss/data.Total.Turnover"></td>
                <td class="text-right" [napIntegerFormat]="data.Total.BetCount"></td>
                <td></td>
            </tr>
        </table>
    </div>
</div>
