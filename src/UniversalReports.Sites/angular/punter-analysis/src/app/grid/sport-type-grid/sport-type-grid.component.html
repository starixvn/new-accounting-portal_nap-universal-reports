<div style="width: auto" class="grid">
    <div class="header">
        <table style="width: 570px">
            <colgroup>
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 90px" />
                <col style="width: 120px" />
            </colgroup>
            <tr>
                <th>Sport Type</th>
                <th>Win Loss</th>
                <th>Turnover</th>
                <th>Margin</th>
                <th>Bet Count</th>
            </tr>
            <tr *ngIf="viewModelItem.Entities.length === 0">
                <th class="empty-data" colspan="5">There is no data</th>
            </tr>
        </table>
    </div>
    <div *ngIf="viewModelItem.Entities.length > 0" class="body" style="width: 590px">
        <table style="width: 570px">
            <colgroup>
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 90px" />
                <col style="width: 120px" />
            </colgroup>
            <tr *ngFor="let sportTypeItem of viewModelItem.Entities">
                <td><a href="javascript:;" (click)="onShowBetType(sportTypeItem.SportId)">{{ sportTypeItem.SportName }}</a></td>
                <td [napDecimalFormat]="sportTypeItem.WinLoss"></td>
                <td [napDecimalFormat]="sportTypeItem.Turnover"></td>
                <td [napPercentFormat]="sportTypeItem.WinLoss/sportTypeItem.Turnover"></td>
                <td>
                    <a href="javascript:;" (click)="onShowBetCount(sportTypeItem.CustId)" [napIntegerFormat]="sportTypeItem.BetCount"></a>
                </td>
            </tr>
        </table>
    </div>
    <div class="footer" *ngIf="viewModelItem.Entities.length > 0" style="width: 570px">
        <table style="width: 570px">
            <colgroup>
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 90px" />
                <col style="width: 120px" />
            </colgroup>
            <tr>
                <td style="width:120px" class="text-right">Total</td>
                <td [napDecimalFormat]="viewModelItem.Total.WinLoss"></td>
                <td [napDecimalFormat]="viewModelItem.Total.Turnover"></td>
                <td [napPercentFormat]="viewModelItem.Total.WinLoss/viewModelItem.Total.Turnover"></td>
                <td [napDecimalFormat]="viewModelItem.Total.BetCount"></td>
            </tr>
        </table>
    </div>
</div>
