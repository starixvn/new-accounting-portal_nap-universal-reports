<div *ngIf="data" style="width: auto" class="grid">
    <div class="header">
        <table style="width: 570px">
            <colgroup>
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 90px" />
                <col style="width: 120px" />
            </colgroup>
            <tr>
                <th>Sport Type</th>
                <th>Win Loss</th>
                <th>Turnover</th>
                <th>Margin</th>
                <th>Bet Count</th>
            </tr>
            <tr *ngIf="data.Entities.length === 0">
                <th class="empty-data" colspan="5">There is no data</th>
            </tr>
        </table>
    </div>
    <div *ngIf="data.Entities.length > 0" class="body" style="width: 590px">
        <table style="width: 570px">
            <colgroup>
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 90px" />
                <col style="width: 120px" />
            </colgroup>
            <tr *ngFor="let item of data.Entities">
                <td><a href="javascript:;" (click)="showBetType(item.SportId, item.SportName)">{{ item.SportName }}</a></td>
                <td [napDecimalFormat]="item.WinLoss"></td>
                <td [napDecimalFormat]="item.Turnover"></td>
                <td [napPercentFormat]="item.WinLoss/item.Turnover"></td>
                <td class="text-right">
                    <a href="javascript:;" (click)="showBetCount(item.SportId)" [napIntegerFormat]="item.BetCount"></a>
                </td>
            </tr>
        </table>
    </div>
    <div class="footer" *ngIf="data.Entities.length > 0" style="width: 570px">
        <table style="width: 570px">
            <colgroup>
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 90px" />
                <col style="width: 120px" />
            </colgroup>
            <tr>
                <td style="width:120px" class="text-right">Total</td>
                <td [napDecimalFormat]="data.Total.WinLoss"></td>
                <td [napDecimalFormat]="data.Total.Turnover"></td>
                <td [napPercentFormat]="data.Total.WinLoss/data.Total.Turnover"></td>
                <td [napDecimalFormat]="data.Total.BetCount"></td>
            </tr>
        </table>
    </div>
</div>
