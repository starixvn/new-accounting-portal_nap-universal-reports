<div style="width: auto" class="grid">
    <div class="header">
        <table style="width: 570px">
            <colgroup>
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 90px" />
                <col style="width: 120px" />
            </colgroup>
            <tr>
                <th>Sport Type</th>
                <th>Win Loss</th>
                <th>Turnover</th>
                <th>Margin</th>
                <th>Bet Count</th>
            </tr>
            <tr *ngIf="viewModelItem.Entities.length === 0">
                <th class="empty-data" colspan="5">There is no data</th>
            </tr>
        </table>
    </div>
    <div *ngIf="viewModelItem.Entities.length > 0" class="body" style="width: 590px">
        <table style="width: 570px">
            <colgroup>
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 90px" />
                <col style="width: 120px" />
            </colgroup>
            <tr *ngFor="let sportTypeItem of viewModelItem.Entities">
                <td class="string"><a href="javascript:;" (click)="onShowBetType(sportTypeItem.SportId)">{{ sportTypeItem.SportName }}</a></td>
                <td class="number" decimal-text [decimal]="sportTypeItem.WinLoss"></td>
                <td class="number" decimal-text [decimal]="sportTypeItem.Turnover"></td>
                <td class="number" margin-text [turnover]="sportTypeItem.Turnover" [win-loss]="sportTypeItem.WinLoss"></td>
                <td class="number"><a href="javascript:;" (click)="onShowBetCount(sportTypeItem.CustId)" integer-text [integer]="sportTypeItem.BetCount"></a></td>
            </tr>
        </table>
    </div>
    <div class="footer" *ngIf="viewModelItem.Entities.length > 0" style="width: 570px">
        <table style="width: 570px">
            <colgroup>
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 120px" />
                <col style="width: 90px" />
                <col style="width: 120px" />
            </colgroup>
            <tr>
                <td style="width:120px; text-align: right" class="string">Total</td>
                <td class="number" decimal-text [decimal]="viewModelItem.Total.WinLoss"></td>
                <td class="number" decimal-text [decimal]="viewModelItem.Total.Turnover"></td>
                <td class="number" margin-text [turnover]="viewModelItem.Total.Turnover" [win-loss]="viewModelItem.Total.WinLoss"></td>
                <td class="number" decimal-text [decimal]="viewModelItem.Total.BetCount"></td>
            </tr>
        </table>
    </div>
</div>
