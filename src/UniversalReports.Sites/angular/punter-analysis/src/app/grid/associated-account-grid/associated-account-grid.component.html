<div style="width: auto" class="grid">
    <div class="header" style="width: 420px">
        <table style="width: 420px">
            <colgroup>
                <col style="width: 300px" />
                <col style="width: 120px" />
            </colgroup>
            <tr>
                <th>Username</th>
                <th>Role</th>
            </tr>
            <tr *ngIf="userRoleItems.length === 0">
                <th class="empty-data" colspan="2">There is no data</th>
            </tr>
        </table>
    </div>
    <div *ngIf="userRoleItems.length > 0" class="body" style="width: 440px">
        <table style="width: 420px">
            <colgroup>
                <col style="width: 300px" />
                <col style="width: 120px" />
            </colgroup>
            <tr *ngFor="let userRoleItem of userRoleItems">
                <td class="string">{{ userRoleItem.Username }}</td>
                <td class="string-same-length">{{ userRoleItem.RoleName }}</td>
            </tr>
        </table>
    </div>
</div>
