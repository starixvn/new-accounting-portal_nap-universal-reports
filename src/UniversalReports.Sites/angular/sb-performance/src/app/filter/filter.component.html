<div class="nap-filter">
  <div class="row">
    <div class="nap-col">
      <div class="nap-group">
        <label>From</label>
        <div class="nap-control">
          <nap-date-picker [(date)]="startDate" [minDate]="minStartDate" [maxDate]="endDate"
            (dateChange)="onDateChangeFrom()"></nap-date-picker>
        </div>
      </div>
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label>To</label>
        <div class="nap-control">
          <nap-date-picker [(date)]="endDate" [minDate]="startDate" [maxDate]="maxEndDate"
            (dateChange)="onDateChangeTo()"></nap-date-picker>
        </div>
      </div>
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label class="col-form-label">Time Range(GMT-4)</label>
        <div class="nap-control">
          <select class="form-control" [disabled]="isDisableTimeRangeOptions" [(ngModel)]="timeRangeSelected">
            <option *ngFor="let item of timeRangeOptions" [ngValue]="item">
              {{item.Name}}
            </option>
          </select>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="nap-col">
      <div class="nap-group">
        <label>Margin(%) &le;</label>
        <div class="nap-control">
          <input type="number" [(ngModel)]="margin" class="width-150" step="0.01">
        </div>
      </div>
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label>Top rows</label>
        <div class="nap-control">
          <select class="form-control" [(ngModel)]="topRowSelected">
            <option *ngFor="let item of topRowOptions" [ngValue]="item">
              {{item.Name}}
            </option>
          </select>
        </div>
      </div>
    </div>
    <div class="nap-col col-buttons">
      <label>&nbsp;</label>
      <button type="button" class="btn btn-primary" (click)="onGenerateClick()">
        GENERATE
      </button>
    </div>
  </div>
</div>
