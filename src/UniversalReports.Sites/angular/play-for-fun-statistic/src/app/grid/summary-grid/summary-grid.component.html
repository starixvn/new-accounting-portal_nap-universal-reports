<ng-template #colgroup>
    <colgroup>
        <col style="width: 120px" />
        <col style="width: 120px" />
        <col style="width: 150px" />
        <col style="width: 150px" />
        <col style="width: 120px" />
    </colgroup>
</ng-template>
<div *ngIf="data" class="grid">
    <div style="width: 680px">
        <div class="header" [class.empty-data]="!hasData">
            <table>
                <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>No.Players</th>
                        <th>Turnover</th>
                        <th>Member Win Loss</th>
                        <th>Play Count</th>
                    </tr>
                </thead>
                <tbody *ngIf="!hasData">
                    <tr>
                        <th colspan="5">There is no data</th>
                    </tr>
                </tbody>
            </table>
        </div>
        <div *ngIf="hasData" class="body">
            <table class="table-striped">
                <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                <tbody>
                    <tr *ngFor="let item of data.Entities">
                        <td class="text-center"><a href="javascript:;" (click)="showDate(item.Date)">{{ item.Date | date:'MMM dd, y' }}</a></td>
                        <td class="text-right" [napIntegerFormat]="item.PlayerCount"></td>
                        <td class="text-right" [napDecimalFormat]="item.Turnover"></td>
                        <td class="number" [napDecimalFormat]="item.WinLoss"></td>
                        <td class="text-right" [napIntegerFormat]="item.BetCount"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="footer" *ngIf="hasData">
            <table>
                <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                <tfoot>
                    <tr>
                        <td class="text-right">Total</td>
                        <td class="text-right" [napIntegerFormat]="data.Total.PlayerCount"></td>
                        <td class="text-right" [napDecimalFormat]="data.Total.Turnover"></td>
                        <td class="number" [napDecimalFormat]="data.Total.WinLoss"></td>
                        <td class="text-right" [napIntegerFormat]="data.Total.BetCount"></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>
