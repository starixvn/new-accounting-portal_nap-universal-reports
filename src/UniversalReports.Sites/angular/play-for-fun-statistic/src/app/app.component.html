<nap-navbar></nap-navbar>
<div class="container-fluid" style="min-width: 900px">
  <div class="header-container">
    Gaming /
    <span class="active">Play For Fun Statistic</span>
    <span class="icon" [ngClass]="{'icon-collapse' : isHideFilter, 'icon-expand': !isHideFilter}" (click)="isHideFilter = !isHideFilter"
      [title]="isHideFilter ? 'Show filter' : 'Hide filter'"></span>
  </div>
  <nap-filter [hidden]="isHideFilter" (generate)="onGenerate($event)" (reset)="onReset()"></nap-filter>
  <nap-toast></nap-toast>
  <nap-grid *ngIf="filterModel" [filterModel]="filterModel"></nap-grid>
</div>
<nap-spinner></nap-spinner>
