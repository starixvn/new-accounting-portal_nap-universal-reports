<ng-template #colgroup>
    <colgroup>
      <col style="width: 100px" />
      <col style="width: 150px" />
      <col style="width: 150px" />
      <col style="width: 130px" />
      <col style="width: 130px" />
      <col style="width: 140px" />
      <col style="width: 120px" />
    </colgroup>
  </ng-template>
  <ng-template #thead>
    <thead>
      <tr>
        <th scope="col">Live/Non-Live</th>
        <th scope="col">Cash Out Turnover_RM</th>
        <th scope="col">Buy Back Amount_RM</th>
        <th scope="col">Member WL_RM</th>
        <th scope="col">Commission_RM</th>
        <th scope="col">Cash Out Income_RM</th>
        <th scope="col">Total Income_RM</th>
      </tr>
    </thead>
  </ng-template>
  <ng-template #rowItem let-item="item">
    <td><a href="javascript:;" (click)="showBetTypeLevel(item.LiveStatus)">{{getliveNonLiveText(item.LiveStatus)}}</a></td>
    <td class="text-right" [napDecimalFormat]="item.COTurnover_RM"></td>
    <td class="text-right" [napDecimalFormat]="item.BBAmount_RM"></td>
    <td class="text-right red-positive" [napDecimalFormat]="item.MemberWL_RM"></td>
    <td class="text-right" [napDecimalFormat]="item.Comm_RM"></td>
    <td class="text-right red-positive" [napDecimalFormat]="item.COIncome_RM"></td>
    <td class="text-right red-positive" [napDecimalFormat]="item.TotalIncome_RM"></td>
  </ng-template>
  <div *ngIf="dataViewModel" [ngSwitch]="dataViewModel.Total > 0">
    <div class="nap-grid">
        <div style="width: 940px">
            <div class="header">
                <table>
                    <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                    <ng-template [ngTemplateOutlet]="thead"></ng-template>
                </table>
            </div>
            <div *ngSwitchCase="true" class="body">
                <table class="table-striped">
                    <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                    <tbody>
                        <tr *ngFor="let item of dataViewModel.TicketList">
                          <ng-template [ngTemplateOutlet]="rowItem" [ngTemplateOutletContext]="{ item: item }">
                          </ng-template>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div *ngSwitchCase="false" class="body stretch">
                <table>
                    <tbody>
                        <tr>
                            <th scope="col" class="no-data" colspan="7">
                                There is no data
                            </th>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div *ngSwitchCase="true" class="footer">
                <table>
                    <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                    <tfoot>
                        <tr class="font-weight-bold">
                            <td class="text-right">Grand Total</td>
                            <td class="text-right" [napDecimalFormat]="dataViewModel.TotalTicket.COTurnover_RM"></td>
                            <td class="text-right" [napDecimalFormat]="dataViewModel.TotalTicket.BBAmount_RM"></td>
                            <td class="text-right red-positive" [napDecimalFormat]="dataViewModel.TotalTicket.MemberWL_RM"></td>
                            <td class="text-right" [napDecimalFormat]="dataViewModel.TotalTicket.Comm_RM"></td>
                            <td class="text-right red-positive" [napDecimalFormat]="dataViewModel.TotalTicket.COIncome_RM"></td>
                            <td class="text-right red-positive" [napDecimalFormat]="dataViewModel.TotalTicket.TotalIncome_RM"></td>
                        </tr>
                        <tr>
                            <td colspan="7">
                                <nap-pagination [config]="paginationInstance" (pageChange)="onPageChange($event)"></nap-pagination>
                            </td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>
  </div>
