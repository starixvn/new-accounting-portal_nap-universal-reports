<ng-template #colgroup>
    <colgroup>
        <col style="width: 120px" />
        <col style="width: 80px" />
        <col style="width: 80px" />
        <col style="width: 120px" />
        <col style="width: 120px" />
        <col style="width: 120px" />
        <col style="width: 120px" />
        <col style="width: 120px" />
        <col style="width: 120px" />
        <col style="width: 120px" />
        <col style="width: 120px" />
        <col style="width: 120px" />
        <col style="width: 120px" />
        <col style="width: 120px" />
    </colgroup>
</ng-template>
<ng-template #thead>
    <thead>
        <tr>
            <th rowspan="2">Licensee</th>
            <th rowspan="2">Member Count</th>
            <th rowspan="2">Bet Count</th>
            <th rowspan="2">Turnover</th>
            <th colspan="3">Member</th>
            <th colspan="3">Licensee</th>
            <th colspan="4">Company</th>
        </tr>
        <tr>
            <th>WinLoss</th>
            <th>Commission</th>
            <th>Total</th>
            <th>WinLoss</th>
            <th>Commission</th>
            <th>Total</th>
            <th>WinLoss</th>
            <th>Commission</th>
            <th>Pay To Supplier</th>
            <th>Net Income</th>
        </tr>
    </thead>
</ng-template>
<ng-template #breadcrumbToolboxTemplate>
    <div class="breadcrumb-toolbox">
        <div class="toolbox-item">
            <i class="nap-icon nap-icon-breadcrumb-excel" aria-hidden="true" title="Export excel" (click)="exportExcel()"></i>
        </div>
    </div>
</ng-template>
<ng-template #rowItem let-item="item">
    <td>{{ item.LicenseeName }}</td>
    <td class="text-right" [napIntegerFormat]="item.MemberCount"></td>
    <td class="text-right" [napIntegerFormat]="item.BetCount"></td>
    <td class="text-right" [napDecimalFormat]="item.TurnOver"></td>
    <td class="text-right" [napDecimalFormat]="item.MemberWinLoss"></td>
    <td class="text-right" [napDecimalFormat]="item.MemberCommission"></td>
    <td class="text-right" [napDecimalFormat]="item.MemberTotal"></td>
    <td class="text-right" [napDecimalFormat]="item.LicenseeWinLoss"></td>
    <td class="text-right" [napDecimalFormat]="item.LicenseeCommission"></td>
    <td class="text-right" [napDecimalFormat]="item.LicenseeTotal"></td>
    <td class="text-right" [napDecimalFormat]="item.CompanyWinLoss"></td>
    <td class="text-right" [napDecimalFormat]="item.CompanyCommission"></td>
    <td class="text-right" [napDecimalFormat]="item.PayToSupplier"></td>
    <td class="text-right" [napDecimalFormat]="item.CompanyNetIncome"></td>
</ng-template>
<div *ngIf="exchangeModel" [ngSwitch]="exchangeModel.Entities.length > 0">
    <div class="grid">
        <div style="position: fixed; width: 1620px; margin: 0;">
            <nap-breadcrumb *ngSwitchCase="true" [items]="breadcrumbItems" [toolboxTemplate]="breadcrumbToolboxTemplate"></nap-breadcrumb>
            <nap-breadcrumb *ngSwitchCase="false" [items]="breadcrumbItems"></nap-breadcrumb>
        </div>
        <div style="width: 1620px; margin-top: 27px;">
            <div class="header">
                <table>
                    <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                    <ng-template [ngTemplateOutlet]="thead"></ng-template>
                </table>
            </div>
            <div *ngSwitchCase="true" class="body">
                <table class="table-striped">
                    <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                    <tbody>
                        <tr *ngFor="let item of displayExchange">
                            <ng-template [ngTemplateOutlet]="rowItem" [ngOutletContext]="{ item: item }">
                            </ng-template>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div *ngSwitchCase="false" class="body stretch">
                <table>
                    <tbody>
                        <tr>
                            <th class="no-data" colspan="15">
                                There is no data
                            </th>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div *ngSwitchCase="true" class="footer">
                <table>
                    <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                    <tfoot>
                        <tr class="font-weight-bold">
                            <td>{{ exchangeModel.Total.LicenseeName }}</td>
                            <td class="text-right" [napIntegerFormat]="exchangeModel.Total.MemberCount"></td>
                            <td class="text-right" [napIntegerFormat]="exchangeModel.Total.BetCount"></td>
                            <td class="text-right" [napDecimalFormat]="exchangeModel.Total.TurnOver"></td>
                            <td class="text-right" [napDecimalFormat]="exchangeModel.Total.MemberWinLoss"></td>
                            <td class="text-right" [napDecimalFormat]="exchangeModel.Total.MemberCommission"></td>
                            <td class="text-right" [napDecimalFormat]="exchangeModel.Total.MemberTotal"></td>
                            <td class="text-right" [napDecimalFormat]="exchangeModel.Total.LicenseeWinLoss"></td>
                            <td class="text-right" [napDecimalFormat]="exchangeModel.Total.LicenseeCommission"></td>
                            <td class="text-right" [napDecimalFormat]="exchangeModel.Total.LicenseeTotal"></td>
                            <td class="text-right" [napDecimalFormat]="exchangeModel.Total.CompanyWinLoss"></td>
                            <td class="text-right" [napDecimalFormat]="exchangeModel.Total.CompanyCommission"></td>
                            <td class="text-right" [napDecimalFormat]="exchangeModel.Total.PayToSupplier"></td>
                            <td class="text-right" [napDecimalFormat]="exchangeModel.Total.CompanyNetIncome"></td>
                        </tr>
                        <tr>
                            <td colspan="14">
                                <nap-pagination [config]="paginationInstance" (pageChange)="onPageChange($event)"></nap-pagination>
                            </td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>
</div>
