<div class="nap-filter">
  <div class="row">
    <div class="nap-col">
      <div class="nap-group">
        <label class="width-180">Winlost Date (GMT -4)</label>
        <div class="nap-control">
          <nap-date-picker [(date)]="winlostDate" [minDate]="minStartDate" [maxDate]="maxEndDate" (dateChange)="onWinlostDateChange()"></nap-date-picker>
        </div>
      </div>
    </div>

    <div class="nap-col">
      <div class="nap-group">
        <label class="col-form-label">MatchID</label>
        <div class="nap-control width-100">
          <input type="text"  [(ngModel)]="matchId" class="form-control"/>
        </div>
      </div>
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label class="form-check-label width-180">
          <input name="excludeTestCheckbox" type="checkbox" class="form-check-input" [(ngModel)]="isIncludeVoidedTime" />
          Voided Time (GMT -4) >=
        </label>
        <div class="nap-control width-100" *ngIf="isIncludeVoidedTime; else isExcludeVoidedTime">
          <nap-date-picker [(date)]="voidedDate" [minDate]="minStartDate" [maxDate]="maxEndDate" (dateChange)="onVoidDateChange()"></nap-date-picker>
        </div>
        <ng-template #isExcludeVoidedTime>
          <div class="nap-control width-100">
            <div class="input-group">
              <input type="text" [(ngModel)]="voidedDateTemp" class="form-control" disabled/>
              <div class="input-group-addon">
                <i class="fa fa-calendar" aria-hidden="true"></i>
              </div>
            </div>
          </div>
        </ng-template>
        <div class="nap-control width-100"><input type="text" placeholder="hh:mm:ss AM/PM" [(ngModel)]="voidedTime" class="form-control" [disabled]="!isIncludeVoidedTime"/></div>
      </div>
    </div>

    <div class="nap-col col-buttons">
      <button class="btn btn-primary" (click)="onGenerate()">GENERATE</button>
    </div>
  </div>
</div>
