<pagination-template #p="paginationApi" [id]="config.id" (pageChange)="config.currentPage = $event">
    <nav aria-label="Page navigation">
        <span>Page size</span>
        <div class="d-inline-block">
            <select class="form-control" [(ngModel)]="config.itemsPerPage">
                <option *ngFor="let item of pageSizes">{{item}}</option>
            </select>
        </div>
        <div class="d-inline-block">
            <ul class="pagination">
                <li class="page-item" [class.disabled]="p.isFirstPage()">
                    <a (click)="p.previous()" class="page-link" href="javascript:;" aria-label="Previous">
                        <span aria-hidden="true">&lt;</span>
                        <span class="sr-only">Previous</span>
                    </a>
                </li>
                <li class="page-item" *ngFor="let page of p.pages" [class.active]="p.getCurrent() === page.value">
                    <a class="page-link" (click)="p.setCurrent(page.value)" *ngIf="p.getCurrent() !== page.value" href="javascript:;">
                        {{ page.label }}
                    </a>
                    <div class="page-link" *ngIf="p.getCurrent() === page.value">
                        {{ page.label }}
                    </div>
                </li>
                <li class="page-item" [class.disabled]="p.isLastPage()">
                    <a (click)="p.next() " class="page-link " href="javascript:;" aria-label="Next ">
                        <span aria-hidden="true ">&gt;</span>
                        <span class="sr-only ">Next</span>
                    </a>
                </li>
            </ul>
        </div>
        <div class="displaying">
            <span>Displaying <b>{{startIndex}}</b> to <b>{{endIndex}}</b> of <b>{{config.totalItems}}</b> item(s)</span>
        </div>
    </nav>
</pagination-template>
